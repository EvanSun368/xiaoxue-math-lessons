      <h1>第4题 · 熊、小狗与飞机</h1>

      <h2>题干</h2>
      <div class="stem">玩具熊48元，小狗8元。(1)买一只熊的钱可以买几只小狗？(2)1架飞机的钱可买8只小狗；小可的钱够买4架飞机，若全买小狗能买几只？</div>

      <h2>思路讲解</h2>
      <ol class="steps">
        <li>(1) 48÷8 = 6（只）。</li>
        <li>(2) 不必先算飞机单价：1架飞机=8只小狗，4架=8×4=32只。</li>
      </ol>
      <div class="answer-box">【答案】(1) 6 只；(2) 32 只</div>
      <p class="tip">💡 把钱换成“小狗个数”来比较，更省事。</p>
    </div>
