      <h1>第2题 · 铁丝原来多长？</h1>

      <h2>题干</h2>
      <div class="stem">一根铁丝截了两次：第一次截去一半还多2米；第二次截去剩下的一半还多1米；还剩2米。原来多长？</div>

      <h2>思路讲解</h2>
      <ol class="steps">
        <li>从最后往前逆推：“截去一半还多”的逆运算是先加回多截的，再×2。</li>
        <li>第二次前：(2+1)×2 = 6 米。</li>
        <li>第一次前：(6+2)×2 = 16 米。</li>
      </ol>
      <div class="answer-box">【答案】16 米</div>
      <p class="tip">💡 逆推口诀：加回多截的，再翻倍。</p>
    </div>
