      <h1>第5题 · 舞蹈队增减几人？</h1>

      <h2>题干</h2>
      <div class="stem">舞蹈队原招男生6人、女生35人。现改成女生人数是男生的5倍；女生仍是35人，男生要增减几人？</div>

      <h2>思路讲解</h2>
      <ol class="steps">
        <li>女生是男生的5倍 → 男生 = 女生÷5。</li>
        <li>35÷5 = 7（人），现在应有男生7人。</li>
        <li>7−6=1，比原计划多1人 → 要增加1人。</li>
      </ol>
      <div class="answer-box">【答案】增加 1 人</div>
      <p class="tip">💡 验算：男生7，女生35，35=7×5。</p>
    </div>
