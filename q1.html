      <h1>第1题 · 气球有多少个？</h1>

      <h2>题干</h2>
      <div class="stem">一束气球多于30少于50。分给若干小朋友，每人分到的个数正好等于小朋友人数。可能有多少个气球？</div>

      <h2>思路讲解</h2>
      <ol class="steps">
        <li>设小朋友有 n 人，每人分到 n 个，总数 = n × n = n²。</li>
        <li>在 30～50 之间找完全平方数。</li>
        <li>6×6=36，7×7=49；8×8=64 太大，5×5=25 太小。</li>
      </ol>
      <div class="answer-box">【答案】36 和 49</div>
      <p class="tip">💡 人数等于每人个数时，总数一定是完全平方数。</p>
    </div>
