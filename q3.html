      <h1>第3题 · 桃子再添几个？</h1>

      <h2>题干</h2>
      <div class="stem">有38个桃子，至少再添几个才能平均分给6只猴子？①2 ②4 ③10</div>

      <h2>思路讲解</h2>
      <ol class="steps">
        <li>先算 38÷6 = 6 …… 余 2。</li>
        <li>还差 6−2=4 个，才能凑成下一个6的倍数。</li>
        <li>38+4=42，42÷6=7，正好整除。添2得40仍不能整除。</li>
      </ol>
      <div class="answer-box">【答案】② 4</div>
      <p class="tip">💡 “至少再添几个”=使能整除的最小非负补数。</p>
    </div>
